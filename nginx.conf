server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # כותרות אבטחה (security-headers.inc). ב-nginx add_header בתוך location מבטל את מה שהוגדר ברמת ה-server,
  # ולכן הקובץ נכלל גם בכל location.
  include /etc/nginx/security-headers.inc;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # קבצי assets עם hash - קאש ארוך
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback (BrowserRouter) - ללא קאש ל-index.html
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
